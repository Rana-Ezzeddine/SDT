[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sdt-dpo-training"
version = "0.2.0"
description = "Auditable SDT preference preparation, full-parameter DPO, and fixed-pair evaluation."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "accelerate>=1,<2",
  "datasets>=3,<5",
  "PyYAML>=6,<7",
  "torch>=2.2",
  "transformers>=4.46,<6",
  "trl>=0.18,<2",
]

[project.scripts]
sdt-build-pairs = "sdt_dpo.pairs:main"
sdt-train-dpo = "sdt_dpo.train:main"
sdt-evaluate-pairs = "sdt_dpo.evaluate:main"
sdt-compare-evaluations = "sdt_dpo.compare:main"
sdt-verify-checkpoint = "sdt_dpo.verify_checkpoint:main"
sdt-generate-responses = "sdt_dpo.generate:main"
sdt-judge-generations = "sdt_dpo.judge_generations:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
