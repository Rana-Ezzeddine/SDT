model_id: microsoft/Phi-4-mini-instruct
training_method: full_parameter_dpo
enforce_run_identity: true
label_mode: jev
pairs_file: data/processed/jev_dpo_pairs.jsonl
output_dir: outputs/jev-phi4
filter_by_confidence: false
min_sdt_margin: 0.0
min_label_margin: 0.0
beta: 0.1
loss_type: sigmoid
learning_rate: 1.0e-6
warmup_ratio: 0.03
num_train_epochs: 1
per_device_train_batch_size: 1
per_device_eval_batch_size: 1
gradient_accumulation_steps: 8
max_length: 1536
precompute_ref_log_probs: true
eval_strategy: steps
save_strategy: steps
eval_steps: 250
save_steps: 250
save_total_limit: 2
metric_for_best_model: eval_rewards/accuracies
greater_is_better: true
logging_steps: 10
resume_from_checkpoint: auto
seed: 42
